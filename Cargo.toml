[package]
name = "gitstars"
version = "0.0.1"
edition = "2024"
description = "整理、搜索和浏览 GitHub Stars 的仓库管理器（Leptos 重写版）"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 框架
leptos = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = { version = "1", optional = true }

# 错误处理
thiserror = "2"

# 服务端（ssr）
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["compression-gzip", "trace"], optional = true }
simd-json = { version = "0.18", features = ["serde_impl"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json", "gzip"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
axum-extra = { version = "0.12", features = ["cookie"], optional = true }
axum-server = { version = "0.8", features = ["tls-rustls"], optional = true }
dotenvy = { version = "0.15", optional = true }

# 前端（hydrate）
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "DomRect",
    "Location",
    "History",
    "Storage",
    "MediaQueryList",
    "ResizeObserver",
    "ResizeObserverEntry",
] }
leptos_virtual_scroller = { version = "0.1.1", optional = true }

[features]
default = ["ssr"]
hydrate = [
    "leptos/hydrate",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
    "dep:web-sys",
    "dep:leptos_virtual_scroller",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:simd-json",
    "dep:reqwest",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uuid",
    "dep:axum-extra",
    "dep:axum-server",
    "dep:dotenvy",
    "dep:regex",
]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[package.metadata.leptos]
output-name = "gitstars"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
tailwind-input-file = "style/tailwind.css"
